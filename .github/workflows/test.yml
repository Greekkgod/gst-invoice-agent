name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: CLI demo runs
        run: python -m gst_agent data/invoices --our-gstin 29AABCN4821K1ZA --gstr2b data/gstr2b.csv --offline
